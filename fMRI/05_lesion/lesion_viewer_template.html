<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T1 / FLAIR · 候选病变核查</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d1621;color:#e5edf5;font:15px/1.6 "Microsoft YaHei",sans-serif}main{max-width:1500px;margin:auto;padding:28px}h1{font-size:28px}p{color:#b9cad9}.bar{display:flex;gap:22px;flex-wrap:wrap;align-items:center;background:#192a3a;padding:18px;border-radius:10px;margin:20px 0}label{display:flex;align-items:center;gap:8px}select,button{background:#24445a;color:white;padding:7px 10px;border:1px solid #4f7085;border-radius:5px;font:inherit}input{accent-color:#62cbd0}.views{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.view{background:#142434;border:1px solid #2d475a;border-radius:10px;overflow:hidden}.view h2{font-size:16px;margin:12px}.wrap{position:relative;aspect-ratio:1;background:#000}.wrap canvas{width:100%;height:100%;object-fit:contain;cursor:crosshair}.edge{position:absolute;color:#eef6ff;pointer-events:none;font-size:13px}.left{left:8px;top:48%}.right{right:8px;top:48%}.up{left:49%;top:2px}.down{left:49%;bottom:2px}.slider{display:flex;gap:10px;padding:14px}.slider input{flex:1;min-width:0}.slider output{font-size:13px;min-width:66px}.info{padding:20px;background:#192a3a;border-radius:10px;margin-top:22px}.orange{color:#ffb45e}.green{color:#7be9af}a{color:#81d8de}#error{color:#ffada1}@media(max-width:900px){.views{grid-template-columns:1fr}main{padding:15px}}</style>
<main><p>结构影像候选区域 · 本地离线查看</p><h1>T1 / FLAIR与模型候选区域</h1><p>橙色是当前模型的候选标签，绿色轮廓是基底节参考区域。模型输出尚未由影像医生确认；白质高信号不直接等于卒中病灶。</p>
<div class="bar"><label>模型<select id="model"><option value="2">TrUE-Net · 白质高信号</option><option value="0">ATLAS T1 · 卒中候选</option><option value="1">SynthStroke · 卒中候选</option></select></label><label>背景<select id="background"><option value="flair">FLAIR</option><option value="t1">T1</option></select></label><label>透明度<input id="alpha" type="range" min="0" max="100" value="70"><output id="alphaValue">70%</output></label><label><input id="show" type="checkbox" checked>显示候选</label><label><input id="showBG" type="checkbox" checked>基底节参考轮廓</label><button id="reset">复位</button></div>
<p id="loading">正在载入本地影像……</p><p id="error"></p>
<div class="views">
<section class="view"><h2>横断面 · 原图Z轴</h2><div class="wrap"><canvas id="axial"></canvas><span class="edge left">L</span><span class="edge right">R</span><span class="edge up">A</span><span class="edge down">P</span></div><div class="slider"><input id="z" type="range"><output id="zValue"></output></div></section>
<section class="view"><h2>冠状面 · 原图Y轴</h2><div class="wrap"><canvas id="coronal"></canvas><span class="edge left">L</span><span class="edge right">R</span><span class="edge up">S</span><span class="edge down">I</span></div><div class="slider"><input id="y" type="range"><output id="yValue"></output></div></section>
<section class="view"><h2>矢状面 · 原图X轴</h2><div class="wrap"><canvas id="sagittal"></canvas><span class="edge left">P</span><span class="edge right">A</span><span class="edge up">S</span><span class="edge down">I</span></div><div class="slider"><input id="x" type="range"><output id="xValue"></output></div></section>
</div>
<div class="info"><p id="modelInfo"></p><p id="readout"></p><p id="region"></p><p><span class="orange">■ 当前模型候选</span>　<span class="green">— 基底节图谱参考轮廓</span>。图谱轮廓是人群图谱配准后的近似位置，不表示轮廓内组织存在病变。</p><p>鼠标滚轮或滑块切片，点击同步定位。视图沿原生采样轴；物理坐标为患者原生坐标。全部显示数据嵌入页面，无需网络或Docker。</p><a href="病灶候选定位说明.md">结果与方法说明</a> · <a href="病灶候选定位报告.html">图文报告</a></div>
<script type="application/json" id="payload">__DATA_JSON__</script>
<script>
const D=JSON.parse(document.getElementById('payload').textContent),$=id=>document.getElementById(id),[nx,ny,nz]=D.shape,bgIds=new Set([11,12,13,26,50,51,52,58]);let A={},pos={...D.initial};
function idx(x,y,z){return (x*ny+y)*nz+z}function dims(m){return m==='axial'?[nx,ny]:m==='coronal'?[nx,nz]:[ny,nz]}function voxel(m,u,v){return m==='axial'?[u,ny-1-v,pos.z]:m==='coronal'?[u,pos.y,nz-1-v]:[pos.x,u,nz-1-v]}
async function unpack(s){const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())}
function draw(m){const canvas=$(m),[w,h]=dims(m);canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d'),im=ctx.createImageData(w,h),gray=A[$('background').value],bit=1<<Number($('model').value),alpha=$('show').checked?Number($('alpha').value)/100:0;
for(let v=0;v<h;v++)for(let u=0;u<w;u++){const xyz=voxel(m,u,v),i=idx(...xyz),j=(v*w+u)*4,g=gray[i],a=(A.flags[i]&bit)?alpha:0;im.data[j]=g*(1-a)+255*a;im.data[j+1]=g*(1-a)+125*a;im.data[j+2]=g*(1-a)+25*a;im.data[j+3]=255;
if($('showBG').checked&&bgIds.has(A.ho[i])){let border=false;for(const [du,dv] of [[1,0],[-1,0],[0,1],[0,-1]]){const q=[u+du,v+dv];if(q[0]<0||q[0]>=w||q[1]<0||q[1]>=h||!bgIds.has(A.ho[idx(...voxel(m,...q))])){border=true;break}}if(border){im.data[j]=80;im.data[j+1]=225;im.data[j+2]=155}}}ctx.putImageData(im,0,0);
const cross=m==='axial'?[pos.x,ny-1-pos.y]:m==='coronal'?[pos.x,nz-1-pos.z]:[pos.y,nz-1-pos.z];ctx.strokeStyle='rgba(100,200,220,.6)';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(cross[0]+.5,0);ctx.lineTo(cross[0]+.5,h);ctx.moveTo(0,cross[1]+.5);ctx.lineTo(w,cross[1]+.5);ctx.stroke()}
function render(){if(!A.t1)return;for(const m of ['axial','coronal','sagittal'])draw(m);for(const axis of ['x','y','z']){$(axis).value=pos[axis];$(axis+'Value').textContent=pos[axis]+' / '+({x:nx,y:ny,z:nz}[axis]-1)}const p=[pos.x,pos.y,pos.z,1],xyz=D.affine.slice(0,3).map(row=>row.reduce((s,v,i)=>s+v*p[i],0)),i=idx(pos.x,pos.y,pos.z),model=Number($('model').value);$('alphaValue').textContent=$('alpha').value+'%';$('modelInfo').textContent=D.modelInfo[model];$('readout').textContent='原生物理坐标（mm）：'+xyz.map(x=>x.toFixed(1)).join(', ')+'　|　当前候选标签：'+((A.flags[i]&(1<<model))?'有':'无');$('region').textContent='图谱参考：'+(D.hoLabels[A.ho[i]]||'未标记/边界区')+'；白质区参考：'+(D.jhuLabels[A.jhu[i]]||'未标记/边界区')}
for(const [axis,n] of [['x',nx],['y',ny],['z',nz]]){$(axis).min=0;$(axis).max=n-1;$(axis).oninput=()=>{pos[axis]=Number($(axis).value);render()}}
for(const id of ['model','background','alpha','show','showBG'])$(id).oninput=render;$('reset').onclick=()=>{pos={...D.initial};render()};
for(const [m,axis,n] of [['axial','z',nz],['coronal','y',ny],['sagittal','x',nx]]){$(m).addEventListener('wheel',e=>{e.preventDefault();pos[axis]=Math.max(0,Math.min(n-1,pos[axis]+(e.deltaY>0?1:-1)));render()},{passive:false});$(m).onclick=e=>{const r=e.target.getBoundingClientRect(),[w,h]=dims(m),s=Math.min(r.width/w,r.height/h),u=Math.floor((e.clientX-r.left-(r.width-w*s)/2)/s),v=Math.floor((e.clientY-r.top-(r.height-h*s)/2)/s);if(u<0||u>=w||v<0||v>=h)return;const q=voxel(m,u,v);pos={x:q[0],y:q[1],z:q[2]};render()}}
(async()=>{try{for(const key of ['t1','flair','flags','ho','jhu']){A[key]=await unpack(D[key]);if(A[key].length!==nx*ny*nz)throw new Error('影像长度不符：'+key)}$('loading').textContent='本地影像已载入。';render();window.lesionViewerReady=true}catch(e){$('error').textContent='载入失败：'+e.message;console.error(e)}})();
</script></main></html>
